name: Shalielie
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Shalielie:
    type: application
    platform: iOS
    sources:
      - Shalielie
    info:
      path: Shalielie/Info.plist
      properties:
        CFBundleDisplayName: 摄影风格
        NSPhotoLibraryUsageDescription: 需要访问相册，用于保存处理完成后的照片
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shalielie.photostyle
        PRODUCT_NAME: Shalielie
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
